[project]
name = "code-migration-agent"
version = "0.1.0"
description = "Agentic Pydantic v1 -> v2 migration: RAG over the official migration guide, a test-driven fix loop, and an eval harness with baselines."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Jarupong Plodtong" }]
requires-python = ">=3.10"
dependencies = [
    "litellm>=1.50",
    "pydantic>=2.7,<3",
    "pytest>=8",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
rag = ["rank-bm25>=0.2", "numpy>=1.26"]
baseline = ["bump-pydantic"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/migrate_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
